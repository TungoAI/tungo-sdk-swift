# Generated by tungo-sdkgen. Do not edit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TUNGO_SDK_STRICT: "1"

jobs:
  linux:
    name: Linux, Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.10", "6.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Build the library, the tests and the examples
        run: swift build --build-tests
      - name: Test
        run: swift test

  macos:
    name: macOS, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 ships Swift 5.10 (Xcode 15.4), macos-15 ships Swift 6.
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Build the library, the tests and the examples
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Build for iOS, tvOS and watchOS
        run: |
          for platform in iOS tvOS watchOS; do
            xcodebuild build -scheme TungoSDK -destination "generic/platform=${platform}" -skipPackagePluginValidation
          done
